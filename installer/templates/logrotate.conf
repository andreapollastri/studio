# Studio — written by the installer to /etc/logrotate.d/studio: the security log, which fail2ban
# follows and Administration → System shows, kept half a year; truncated in place so the queue
# workers keep writing to the same file.
__STUDIO_HOME__/shared/storage/logs/security.log {
    weekly
    rotate 26
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su studio studio
}
