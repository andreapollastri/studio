# Studio — written by the installer to /etc/fail2ban/filter.d/studio.conf.
# The refusals Studio's security log records, with the address they came from:
#   [2026-10-14 10:00:00] production.WARNING: login.failed email=someone@agency.test ip=203.0.113.9 agent="…"
# a wrong password, a wrong second factor, a wrong door key (a hidden dashboard).
[Definition]
failregex = ^\s*(?:\[[^\]]*\]\s*)?\S+\.(?:WARNING|NOTICE|ERROR): (?:login\.failed|login\.locked|2fa\.failed|passkey\.failed|door\.refused)\b.* ip=<HOST>(?:\s|$)
ignoreregex =
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
