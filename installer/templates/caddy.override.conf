# Studio — written by the installer to /etc/systemd/system/caddy.service.d/studio.conf.
# Caddy's admin API listens on a socket in /run/caddy (the Caddyfile's `admin unix//run/caddy/admin.sock`);
# systemd makes that directory at every start, for caddy alone: a project's PHP or a workspace's
# agent on this server must not reach the API that reconfigures what serves every host.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
