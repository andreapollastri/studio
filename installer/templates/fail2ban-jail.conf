# Studio — written by the installer to /etc/fail2ban/jail.d/studio.conf.
# sshd through the journal (Ubuntu keeps no auth.log by default), and Studio's own jail on its
# security log: ten refusals from one address in a quarter of an hour, and the address is banned
# from the web ports for an hour. Studio itself already slows a single address down before that.
[sshd]
enabled = true
backend = systemd

[studio]
enabled = true
backend = polling
filter = studio
logpath = __STUDIO_HOME__/shared/storage/logs/security.log
logtimezone = UTC
findtime = 15m
maxretry = 10
bantime = 1h
port = http,https
